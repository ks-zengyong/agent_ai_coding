[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tui-coding-agent"
version = "0.1.0"
description = "A TUI terminal coding Agent with Agent Loop, tool system, and permission control"
requires-python = ">=3.11"
dependencies = []

# 运行时零依赖：httpx / rich / pygments / prompt_toolkit 等 vendoring 到 src/_vendor/，
# 由 src/__init__.py 注入 sys.path 优先加载。
# 下载/更新 vendor：python scripts/vendor_deps.py

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
# 动态输入框（上下横线随多行输入扩展）；未安装时回退单行 input()
prompt = [
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
tui-agent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["src._vendor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"