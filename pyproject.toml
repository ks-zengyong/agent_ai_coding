[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tui-coding-agent"
version = "0.1.0"
description = "A TUI terminal coding Agent with Agent Loop, tool system, and permission control"
requires-python = ">=3.11"
dependencies = []

# 运行时零依赖：httpx / rich / pygments / anyio / httpcore / h11 / sniffio /
# idna / certifi / markdown_it / mdurl 已 vendoring 到 src/_vendor/，
# 由 src/__init__.py 注入 sys.path 优先加载；config 用标准库 dataclasses 实现。
# 因此 `pip install -e .` 无需拉取任何运行时依赖即可 `python -m src.main` 运行。

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
tui-agent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"