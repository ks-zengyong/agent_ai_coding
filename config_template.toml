# TUI Coding Agent — 配置模板
#
# 用法：
#   cp config_template.toml .tui_agent/config.toml  # 项目级
#   cp config_template.toml ~/.tui_agent/config.toml  # 用户级（跨项目共享）
#   或通过 --config / 环境变量 TUI_AGENT_CONFIG 指定路径
#
# 配置优先级（低 → 高）：
#   内置默认值
#     < ~/.tui_agent/config.toml                （用户级）
#     < ./.tui_agent/config.toml                （项目级）
#     < --config-dir/config.toml                （命令行 --config-dir）
#     < --config / TUI_AGENT_CONFIG             （显式指定文件）
#       < TUI_AGENT_API_KEY                     （环境变量，仅作用于 api_key）
#
# api_key 优先级（高 → 低）：
#   [[models]].api_key        （模型独立 key，最高优先）
#     > TUI_AGENT_API_KEY     （环境变量，仅填充未独立配置 api_key 的模型）
#     > [provider].api_key    （共享池，兜底未配置的模型）
#
# 安全提示：真实 API Key 不得提交到仓库。建议：
#   - 删除下方所有 api_key 占位行，改用环境变量 TUI_AGENT_API_KEY 注入
#   - 或在 .gitignore 中忽略 .tui_agent/config.toml

# ─────────────────────────── 顶级键（必须在任何 [table] 之前）───────────────────────────
# 当前激活的模型 id（对应下方某个 [[models]].id）；省略时默认使用模型列表第一个
active_model = "deepseek-openai"

# 会话历史持久化目录；相对路径基于 project_dir 解析
history_dir = ".ai_history/logs"

# 日志级别：debug | info | warning | error
log_level = "info"

# ─────────────────────────── 共享 Provider 配置 ───────────────────────────
# 共享 Provider 配置：未在 [[models]] 中单独指定 api_key / timeout_secs / max_retries 的模型会继承此项
[provider]
api_key = "YOUR_API_KEY_HERE"   # 共享 key；推荐改用环境变量 TUI_AGENT_API_KEY
timeout_secs = 60               # 单次请求超时（秒）
max_retries = 3                 # 请求失败重试次数
max_loop = 100                  # Agent 单次任务最大循环步数
max_tokens = 8192               # 单次响应最大 token 数；代码生成建议 ≥ 8192，过小会导致大文件写入被截断
temperature = 0.0               # 生成温度 0.0~2.0；代码生成建议 0.0（确定性输出），创意任务可适当提高

# ─────────────────────────── 模型列表 ───────────────────────────
# 每个模型独立配置；id 必须唯一。运行时通过 /models <id> 切换。
# api_key 可在此独立指定，优先级高于 [provider].api_key 与环境变量。

# 示例 1：OpenAI 协议模型，使用共享 key（继承 [provider].api_key）
[[models]]
id = "deepseek-openai"
label = "DeepSeek V4 (OpenAI)"   # 显示名；省略时回退为 provider/model
provider = "openai"              # openai | anthropic | mock
model = "deepseek-v4-pro"        # 实际模型名（API 透传）
api_url = "https://api.deepseek.com"   # 基础 URL，自动拼接 /chat/completions
timeout_secs = 60
max_retries = 3
# temperature 未写 → 继承 [provider].temperature
# api_key 未写 → 继承 [provider].api_key

# 示例 2：Anthropic 协议模型，使用独立 key（不继承共享池）
[[models]]
id = "deepseek-anthropic"
label = "DeepSeek V4 (Anthropic)"
provider = "anthropic"
model = "deepseek-v4-pro"
api_url = "https://api.deepseek.com/anthropic"   # 自动拼接 /v1/messages
api_key = "sk-deepseek-anthropic-independent"    # 独立 key，优先级最高
timeout_secs = 60
max_retries = 3

# 示例 3：聚合网关（OpenAI 协议），独立 key
[[models]]
id = "kso-deepseek-openai"
label = "KSO/DeepSeek V4 (OpenAI)"
provider = "openai"
model = "deepseek/deepseek-v4-pro"
api_url = "https://ai-kas.kso.net/codeplan/v1"
api_key = "sk-kso-independent-key"
timeout_secs = 60
max_retries = 3

# 示例 4：Mock provider，无需 key，用于离线调试
[[models]]
id = "mock"
label = "Mock (Offline Test)"
provider = "mock"
model = "mock-model"
api_url = "http://localhost:8080"

# ─────────────────────────── 权限控制 ───────────────────────────
# 只读工具（read_file / list_directory / glob / search_code）自动执行；
# 写入/编辑/Shell 类工具按下列规则决定是否需要用户确认。
[permission]
auto_exec_readonly = true   # 只读工具是否自动执行
confirm_write = true        # write_file / edit_file 是否需确认
confirm_shell = true        # execute_command 是否需确认（false = 所有命令自动通过）
shell_level = "auto_safe"   # ask_all | auto_safe | skip_all
                            # ask_all: 所有 shell 命令都询问
                            # auto_safe: 安全命令自动通过（编译/测试/浏览），写入/危险命令询问
                            # skip_all: 所有命令自动通过（含删除、格式化等危险命令）
shell_whitelist = []        # 命令前缀白名单，匹配的自动通过（运行时也可通过 w 键添加）
                            # 示例: ["pytest", "cmake", "git status", "npm install"]
